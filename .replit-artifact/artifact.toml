kind = "mobile"
previewPath = "/"
title = "Micky"
version = "1.0.0"
id = "artifacts/micky"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/" ]
localPort = 24858

[services.development]
run = "pnpm --filter @workspace/micky run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/micky", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/micky", "run", "serve" ]

[services.env]
PORT = "24858"
BASE_PATH = "/"
